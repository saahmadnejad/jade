name: Real IT

# Nightly + manual only: runs the dev-team scenario against the real
# opencode CLI + tokenrouter provider. Costs real tokens and needs
# network; gated by -Dit.real=true + the TOKENROUTER_API_KEY secret.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  real-it:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install opencode CLI (same route as the backend image)
        run: npm install -g opencode-ai@1.18.30 opencode-linux-x64-musl@1.18.30
      - name: CLI sanity
        run: opencode --version
      - name: Real dev-team IT (STATUS + py_compile + unittest + LLM-judge gates)
        working-directory: backend
        env:
          TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
        run: >
          mvn -B -pl examples -am test
          -Dtest=DevTeamRealIT
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dit.real=true
