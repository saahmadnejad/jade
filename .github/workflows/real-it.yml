name: Real IT

# Nightly + manual only: runs the dev-team scenario against the real
# opencode CLI + generic LLM provider (or deprecated TOKENROUTER_API_KEY).
# Costs real tokens and needs network; gated by -Dit.real=true + the LLM_API_KEY secret.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  real-it:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install opencode CLI (same route as the backend image)
        run: npm install -g opencode-ai@1.18.30
      - name: CLI sanity
        run: opencode --version
      - name: Real dev-team IT (STATUS + py_compile + unittest + LLM-judge gates)
        working-directory: backend
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_PROVIDER_ID: ${{ secrets.LLM_PROVIDER_ID }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
        run: >
          mvn -B -pl examples -am test
          -Dtest=DevTeamRealIT
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dit.real=true
