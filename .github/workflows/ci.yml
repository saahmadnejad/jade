name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend tests (all modules)
        working-directory: backend
        run: mvn -B test

  backend-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package (shade uber-jar assembly)
        working-directory: backend
        run: mvn -B package -DskipTests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Shared tests
        working-directory: frontend
        run: pnpm --filter shared test:run
      - name: Webapp tests
        working-directory: frontend
        run: pnpm --filter webapp test:run
      - name: Webapp typecheck
        working-directory: frontend
        run: pnpm --filter webapp typecheck
      - name: Webapp lint
        working-directory: frontend
        run: pnpm --filter webapp lint

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (no push)
        run: docker build -f docker/Dockerfile.backend -t jade-backend:ci .
      - name: Build frontend image (no push)
        run: docker build -f docker/Dockerfile.frontend -t jade-frontend:ci .
      - name: "Smoke: images contain the entrypoints"
        run: |
          docker run --rm --entrypoint sh jade-backend:ci -c 'ls /app/app.jar /app/examples.jar /app/llm.jar && which opencode gh'
          docker run --rm --entrypoint sh jade-frontend:ci -c 'ls /usr/share/nginx/html/index.html'
