name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend tests (all modules)
        working-directory: backend
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install
      - name: Webapp tests
        working-directory: frontend
        run: pnpm --filter webapp test:run
      - name: Shared tests
        working-directory: frontend
        run: pnpm --filter shared test:run
      - name: Webapp lint
        working-directory: frontend
        run: pnpm --filter webapp lint

  # Real dev-team run against live tokenrouter + opencode CLI. Costs real
  # tokens and needs network; manual/nightly only. Example args:
  #   TOKENROUTER_API_KEY (repo secret) + -Dit.real=true
  real-it:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install opencode CLI
        run: |
          curl -fsSL https://github.com/anomalyco/opencode/releases/download/v1.18.25/opencode-linux-x64.tar.gz \
            -o /tmp/opencode.tar.gz
          mkdir -p /tmp/opencode && tar -xzf /tmp/opencode.tar.gz -C /tmp/opencode
          echo /tmp/opencode >> "$GITHUB_PATH"
      - name: Real dev-team IT
        working-directory: backend
        env:
          TOKENROUTER_API_KEY: ${{ secrets.TOKENROUTER_API_KEY }}
        run: >
          mvn -B -pl examples -am test
          -Dtest=DevTeamRealIT
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dit.real=true
