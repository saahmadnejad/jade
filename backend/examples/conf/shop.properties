# Online-shop example scenario configuration for Jade Boot.
# Run with: java -cp backend/jade/target/backend.jar:backend/examples/target/examples-*.jar \
#   io.donbee.jade.Boot -conf backend/examples/conf/shop.properties
#
# Platform settings (adjust to your environment):
rest-port=8080

# Agents of the scenario.
# Specifier format: name:class(arg1,arg2,...) - separated by ';'
agents=shop:io.donbee.jade.examples.shop.ShopAgent();\
inventory:io.donbee.jade.examples.shop.InventoryAgent(sku-laptop:10|sku-phone:5|sku-cable:50,3,10,20);\
supplier:io.donbee.jade.examples.shop.RestockSupplierAgent(5);\
customer1:io.donbee.jade.examples.shop.CustomerAgent(8,1,sku-laptop,sku-phone,sku-cable);\
customer2:io.donbee.jade.examples.shop.CustomerAgent(12,2,sku-laptop,sku-phone)
