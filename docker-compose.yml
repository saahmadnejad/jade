services:
  9router:
    image: docker.io/decolua/9router:latest
    container_name: jade-9router
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/app/data
    environment:
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "pgrep", "-f", "next-server"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: jade-backend
    ports:
      - "10990:1099"
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m
      # CI-friendly passthroughs; values come from the host environment only.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GH_TOKEN=${GH_TOKEN:-}
      - NINEROUTER_API_KEY=${NINEROUTER_API_KEY:-}
    depends_on:
      9router:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "java"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: jade-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  9router-data:
