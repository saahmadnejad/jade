services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: jade-backend
    ports:
      - "10990:1099"
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m
      - TOKENROUTER_API_KEY=${TOKENROUTER_API_KEY:-}
      - GH_TOKEN=${GH_TOKEN:-}
      - LOG_DIR=/app/logs
    volumes:
      - ./backend/examples/conf:/app/conf:ro
      - devteam-workspaces:/workspace

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: jade-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  devteam-workspaces:
