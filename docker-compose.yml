services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: jade-backend
    ports:
      - "10990:1099"
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m
      # CI-friendly passthroughs; values come from the host environment only.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GH_TOKEN=${GH_TOKEN:-}
    healthcheck:
      test: ["CMD", "pgrep", "-f", "java"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: jade-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
